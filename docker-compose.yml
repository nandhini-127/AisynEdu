services:
  # ============================================================================
  # 1. PostgreSQL Relational Database Service
  # ============================================================================
  postgres:
    image: postgres:16
    platform: linux/amd64
    container_name: edunex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-edunex_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-edunex_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - edunex_net

  # ============================================================================
  # 2. FastAPI Backend Application Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: edunex_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      ENVIRONMENT: development
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-edunex-dev-secret-key-32-chars-minimum-length-req}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edunex_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edunex_db}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]'
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - backend_uploads:/app/data/uploads
      - backend_chroma:/app/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - edunex_net

  # ============================================================================
  # 3. React + TypeScript Frontend Service (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "" # Uses relative proxy configured in Nginx
    platform: linux/amd64
    container_name: edunex_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - edunex_net

  # ============================================================================
  # 4. Standalone ChromaDB Vector Store (Optional Distributed Service)
  # ============================================================================
  chromadb:
    image: chromadb/chroma:latest
    platform: linux/amd64
    container_name: edunex_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      ANONYMIZED_TELEMETRY: "False"
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - standalone_chroma_data:/chroma/chroma
    networks:
      - edunex_net

  # ============================================================================
  # 5. Local Ollama LLM Service (Optional Profile: --profile ollama)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: edunex_ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - edunex_net

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  backend_chroma:
    driver: local
  standalone_chroma_data:
    driver: local
  ollama_data:
    driver: local

# ==============================================================================
# Isolated Internal Network
# ==============================================================================
networks:
  edunex_net:
    driver: bridge
